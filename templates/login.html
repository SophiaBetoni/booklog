{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
    <section class="painel formulario-conta">
        <p class="etiqueta">Bem-vindo(a) de volta</p>
        <h1>Entrar</h1>

        <form method="post" action="{{ url_for('usuarios.login') }}">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label>
                Nome de usuário
                <input name="usuario" value="{{ usuario }}" autocomplete="username"
                       autocapitalize="none" required autofocus>
            </label>
            <label>
                Senha
                <input type="password" name="senha" autocomplete="current-password" required>
            </label>
            <button type="submit">Entrar</button>
        </form>

        <p class="suave">
            Ainda não tem conta?
            <a class="link" href="{{ url_for('usuarios.cadastro') }}">Crie a sua</a>.
        </p>
    </section>
{% endblock %}
